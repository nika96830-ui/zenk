name: CI

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vite build
      - run: node --test tests/regressions.test.mjs
